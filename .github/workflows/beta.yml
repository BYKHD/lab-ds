name: Beta snapshot

# On push to develop: run the PR checks, then build a x.y.z-beta.N snapshot
# of @bykhd/lab-ds, upload the packed .tgz, and publish that same .tgz to npm
# under the `beta` dist-tag via Trusted Publishing (OIDC, no token).
# Nothing is committed back to Git; `latest` is never touched.

on:
  push:
    branches: [develop]

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false # never cancel a run mid-publish

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  snapshot:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Any changesets pending?
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No changesets pending, skipping beta snapshot."
          fi

      - if: steps.pending.outputs.found == 'true'
        run: npm ci

      # Edits the CI checkout only; this job never commits or pushes.
      - name: Snapshot config (not committed)
        if: steps.pending.outputs.found == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const f = ".changeset/config.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.snapshot = {
              useCalculatedVersion: true,
              prereleaseTemplate: "{tag}." + process.env.GITHUB_RUN_NUMBER,
            };
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '

      - if: steps.pending.outputs.found == 'true'
        run: npx changeset version --snapshot beta

      - name: Version is x.y.z-beta.N
        id: version
        if: steps.pending.outputs.found == 'true'
        run: |
          v=$(node -p 'require("./packages/ui/package.json").version')
          echo "$v" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+-beta\.${GITHUB_RUN_NUMBER}$" \
            || { echo "::error::Unexpected snapshot version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice::Snapshot version $v"

      - if: steps.pending.outputs.found == 'true'
        run: npm run build

      - name: dist/index.js starts with "use client"
        if: steps.pending.outputs.found == 'true'
        run: head -n 1 packages/ui/dist/index.js | grep -q '"use client"'

      - if: steps.pending.outputs.found == 'true'
        run: mkdir -p out && npm pack -w packages/ui --pack-destination out

      - if: steps.pending.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lab-ds-${{ steps.version.outputs.version }}
          path: out/*.tgz
          if-no-files-found: error

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - if: steps.pending.outputs.found == 'true'
        run: npm install -g npm@11

      # Publishes the exact .tgz uploaded above. --tag beta keeps `latest` on the stable release.
      - name: Publish to npm (beta)
        if: steps.pending.outputs.found == 'true'
        run: npm publish ./out/*.tgz --tag beta --access public # ./ so npm reads a file, not a GitHub owner/repo

      - name: latest still points to a stable version
        if: steps.pending.outputs.found == 'true'
        run: |
          npm view @bykhd/lab-ds dist-tags
          latest=$(npm view @bykhd/lab-ds dist-tags.latest)
          echo "$latest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::latest is $latest, expected a stable version"; exit 1; }
          echo "::notice::Published ${{ steps.version.outputs.version }} to beta; latest is still $latest"
